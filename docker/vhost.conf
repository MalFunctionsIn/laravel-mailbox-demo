<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Belt and braces: never serve a dotfile even if one lands in public/.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Platform log drains read the container's stdout/stderr.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
